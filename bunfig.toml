[install]
exact = true

[test]
preload = ["./svelte-loader.ts"]
pathIgnorePatterns = ["tests/e2e/**", ".stryker-tmp/**"]
# Bun only instruments modules that tests import. These paths are not unit-testable
# in Bun (Svelte components, worker/WASM entry point, server, configs), so keep them out.
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coveragePathIgnorePatterns = [
  "src/lib/model/worker.ts",
  "server/main.ts",
  "svelte-loader.ts",
  "vite.config.ts",
]
coverageThreshold = { lines = 0.9, functions = 0.9 }
